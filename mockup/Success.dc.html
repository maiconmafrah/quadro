<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .stage { --bg: oklch(0.15 0.01 60); --panel: oklch(0.185 0.012 60); --field: oklch(0.12 0.01 60); --line: oklch(0.34 0.01 60); --line-soft: oklch(0.28 0.01 60); --ink: oklch(0.93 0.01 60); --ink-dim: oklch(0.64 0.02 60); --ink-faint: oklch(0.46 0.02 60); --amber: oklch(0.78 0.15 55); --amber-ink: oklch(0.18 0.03 55); --teal: oklch(0.72 0.1 195); --red: oklch(0.65 0.18 25); }
  .sans { font-family: 'Space Grotesk', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  a { color: var(--amber); text-decoration: none; }
  a:hover { color: oklch(0.85 0.16 55); }
</style>
</helmet>

<div class="stage sans" style="width:960px;height:720px;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;">
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 40%, transparent 0%, oklch(0.08 0.01 60 / 0.55) 100%);pointer-events:none;"></div>

  <div style="position:relative;width:520px;">

    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;">
      <div>
        <div class="mono" style="font-size:11px;letter-spacing:.04em;color:var(--ink-faint);margin-bottom:6px;">ferramenta pessoal</div>
        <div style="font-size:28px;font-weight:600;line-height:1;">quadro</div>
        <div class="sans" style="font-size:13px;color:var(--ink-dim);margin-top:6px;">baixe vídeos do YouTube e Facebook a partir de um link</div>
      </div>
      <button style="width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M9 18h6M10 21h4" stroke="var(--ink-dim)" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M12 3a6 6 0 0 0-3.5 10.9c.6.45 1 1.15 1 1.9V17h5v-1.2c0-.75.4-1.45 1-1.9A6 6 0 0 0 12 3Z" stroke="var(--ink-dim)" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div style="position:relative;background:var(--panel);padding:28px;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="position:absolute;top:-8px;left:-8px;"><path d="M1 13V1H13" stroke="var(--amber)" stroke-width="1.6" opacity="0.55"/></svg>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="position:absolute;top:-8px;right:-8px;"><path d="M19 13V1H7" stroke="var(--amber)" stroke-width="1.6" opacity="0.55"/></svg>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="position:absolute;bottom:-8px;left:-8px;"><path d="M1 7V19H13" stroke="var(--amber)" stroke-width="1.6" opacity="0.55"/></svg>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="position:absolute;bottom:-8px;right:-8px;"><path d="M19 7V19H7" stroke="var(--amber)" stroke-width="1.6" opacity="0.55"/></svg>

      <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line-soft);">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="width:7px;height:7px;border-radius:50%;background:var(--teal);display:inline-block;"></span>
          <span class="mono" style="font-size:12px;color:var(--ink-dim);">concluído</span>
        </div>
        <span class="mono" style="font-size:12px;color:var(--ink-faint);">00:03:41</span>
      </div>

      <div class="mono" style="font-size:11px;color:var(--ink-faint);margin-bottom:6px;">link do vídeo</div>
      <div style="position:relative;">
        <input type="text" value="youtube.com/watch?v=dQw4w9WgXcQ" disabled class="mono" style="width:100%;background:var(--field);border:1px solid var(--line-soft);color:var(--ink-dim);font-size:13px;padding:12px 108px 12px 14px;outline:none;" />
        <span class="mono" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:5px;border:1px solid var(--line);padding:3px 8px;font-size:11px;color:var(--ink-dim);">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M9 7v10l8-5-8-5Z" fill="var(--ink-dim)"/></svg>
          YouTube
        </span>
      </div>

      <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--line-soft);display:flex;gap:14px;align-items:center;">
        <div style="flex:0 0 108px;height:64px;background:oklch(0.1 0.01 60);border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 7v10l8-5-8-5Z" fill="var(--ink-faint)"/></svg>
        </div>
        <div style="min-width:0;flex:1;">
          <div class="sans" style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Never Gonna Give You Up — Rick Astley</div>
          <div class="mono" style="font-size:11px;color:var(--ink-faint);margin-top:6px;">mp4 · 1080p · 42.8 mb · 03:41</div>
        </div>
      </div>

      <button style="margin-top:22px;width:100%;background:var(--amber);color:var(--amber-ink);border:none;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;padding:14px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5" stroke="var(--amber-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 19h16" stroke="var(--amber-ink)" stroke-width="2" stroke-linecap="round"/></svg>
        Salvar arquivo
      </button>
      <div class="mono" style="text-align:center;font-size:12px;color:var(--ink-dim);margin-top:14px;cursor:pointer;">baixar outro vídeo</div>
    </div>

    <div class="mono" style="text-align:center;font-size:11px;color:var(--ink-faint);margin-top:16px;">uso pessoal — respeite direitos autorais e termos das plataformas</div>
  </div>
</div>
</x-dc>
</body>
</html>
