<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .stage { --bg: oklch(0.97 0.006 90); --panel: oklch(0.955 0.007 90); --field: oklch(0.925 0.008 90); --line: oklch(0.78 0.01 90); --line-soft: oklch(0.86 0.008 90); --ink: oklch(0.22 0.012 90); --ink-dim: oklch(0.45 0.015 90); --ink-faint: oklch(0.6 0.015 90); --amber: oklch(0.7 0.16 55); --amber-ink: oklch(0.18 0.03 55); --teal: oklch(0.55 0.1 195); --red: oklch(0.55 0.19 25); }
  .sans { font-family: 'Space Grotesk', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  a { color: var(--amber); text-decoration: none; }
  a:hover { color: oklch(0.6 0.17 55); }
</style>
</helmet>

<div class="stage sans" style="width:960px;height:720px;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;">

  <div style="position:relative;width:520px;">

    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;">
      <div>
        <div class="mono" style="font-size:11px;letter-spacing:.04em;color:var(--ink-faint);margin-bottom:6px;">ferramenta pessoal</div>
        <div style="font-size:28px;font-weight:600;line-height:1;">quadro</div>
        <div class="sans" style="font-size:13px;color:var(--ink-dim);margin-top:6px;">baixe vídeos do YouTube e Facebook a partir de um link</div>
      </div>
      <button style="width:36px;height:36px;border-radius:50%;border:1px solid var(--amber);background:oklch(0.7 0.16 55 / 0.14);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 0 14px oklch(0.7 0.16 55 / 0.4);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M9 18h6M10 21h4" stroke="var(--amber)" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M12 3a6 6 0 0 0-3.5 10.9c.6.45 1 1.15 1 1.9V17h5v-1.2c0-.75.4-1.45 1-1.9A6 6 0 0 0 12 3Z" stroke="var(--amber)" stroke-width="1.6" stroke-linejoin="round" fill="oklch(0.7 0.16 55 / 0.3)"/>
        </svg>
      </button>
    </div>

    <div style="position:relative;background:var(--panel);padding:28px;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="position:absolute;top:-8px;left:-8px;"><path d="M1 13V1H13" stroke="var(--amber)" stroke-width="1.6" opacity="0.55"/></svg>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="position:absolute;top:-8px;right:-8px;"><path d="M19 13V1H7" stroke="var(--amber)" stroke-width="1.6" opacity="0.55"/></svg>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="position:absolute;bottom:-8px;left:-8px;"><path d="M1 7V19H13" stroke="var(--amber)" stroke-width="1.6" opacity="0.55"/></svg>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="position:absolute;bottom:-8px;right:-8px;"><path d="M19 7V19H7" stroke="var(--amber)" stroke-width="1.6" opacity="0.55"/></svg>

      <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line-soft);">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="width:7px;height:7px;border-radius:50%;background:var(--ink-faint);display:inline-block;"></span>
          <span class="mono" style="font-size:12px;color:var(--ink-dim);">aguardando link</span>
        </div>
        <span class="mono" style="font-size:12px;color:var(--ink-faint);">--:--:--</span>
      </div>

      <div class="mono" style="font-size:11px;color:var(--ink-faint);margin-bottom:6px;">link do vídeo</div>
      <div style="position:relative;">
        <input type="text" placeholder="Cole aqui o link do YouTube ou Facebook" class="mono" style="width:100%;background:var(--field);border:1px solid var(--line-soft);color:var(--ink);font-size:13px;padding:12px 14px;outline:none;" />
      </div>
      <div class="sans" style="font-size:12px;color:var(--ink-faint);margin-top:8px;">Detectamos a plataforma automaticamente assim que você colar o link.</div>

      <div style="margin-top:22px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <div class="mono" style="font-size:11px;color:var(--ink-faint);">chave de acesso</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="sans" style="font-size:11px;color:var(--ink-faint);">salvar neste dispositivo</span>
          <span style="width:28px;height:16px;border-radius:9px;background:var(--amber);position:relative;display:inline-block;">
            <span style="position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:var(--amber-ink);"></span>
          </span>
        </div>
      </div>
      <div style="position:relative;">
        <input type="password" placeholder="••••••••••••" class="mono" style="width:100%;background:var(--field);border:1px solid var(--line-soft);color:var(--ink);font-size:13px;padding:12px 40px 12px 14px;outline:none;" />
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="var(--ink-faint)" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="3" stroke="var(--ink-faint)" stroke-width="1.6"/>
        </svg>
      </div>

      <button style="margin-top:26px;width:100%;background:var(--amber);color:var(--amber-ink);border:none;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;padding:14px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5" stroke="var(--amber-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 19h16" stroke="var(--amber-ink)" stroke-width="2" stroke-linecap="round"/></svg>
        Baixar vídeo
      </button>
    </div>

    <div class="mono" style="text-align:center;font-size:11px;color:var(--ink-faint);margin-top:16px;">uso pessoal — respeite direitos autorais e termos das plataformas</div>
  </div>
</div>
</x-dc>
</body>
</html>
